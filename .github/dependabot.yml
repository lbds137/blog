version: 2
updates:
  # GitHub Actions pins (checkout, withastro/action, ...): weekly bumps. npm security
  # updates come from the repo's Dependabot security-updates setting, not from here.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 5
    reviewers:
      - 'lbds137'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
